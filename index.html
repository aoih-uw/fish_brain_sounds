<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#111315;font-family:'Space Grotesk',Helvetica,sans-serif;overflow:hidden;}
a{color:#85b6b2;}a:hover{color:#e49444;}
button{font:inherit;}
@keyframes ehDraw{0%{stroke-dashoffset:1;opacity:1}40%{stroke-dashoffset:0;opacity:1}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes ehRipple{0%{transform:scale(70);opacity:0}12%{opacity:1}100%{transform:scale(330);opacity:0}}
</style>
</helmet>
<div style="height:100dvh;display:grid;grid-template-columns:{{ L.rootCols }};grid-template-rows:{{ L.rootRows }};background:#111315;color:#e8e6e1;">
  <div style="display:flex;flex-direction:column;justify-content:space-between;padding:{{ L.sidePad }};gap:{{ L.sideGap }};border-right:{{ L.sideBR }};border-bottom:{{ L.sideBB }};overflow-y:auto;box-sizing:border-box;">
    <div style="display:flex;flex-direction:column;gap:{{ L.groupsGap }};">
      <div style="display:flex;flex-direction:{{ L.groupDir }};gap:{{ L.itemGap }};">
        <div style="display:{{ L.labelDisp }};font-family:'Inter',sans-serif;font-size:12px;letter-spacing:0.14em;color:#8a8d91;margin-bottom:8px;">VIEW</div>
        <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="2">
          <button onClick="{{ tb.select }}" style="flex:{{ tb.flex }};display:flex;align-items:center;justify-content:{{ tb.justify }};padding:{{ tb.pad }};border-radius:10px;border:1px solid {{ tb.border }};background:{{ tb.bg }};color:{{ tb.fg }};cursor:pointer;text-align:left;font-size:{{ tb.size }};font-weight:500;white-space:nowrap;">{{ tb.label }}</button>
        </sc-for>
      </div>
      <div style="display:{{ L.freqDisp }};flex-direction:{{ L.groupDir }};gap:{{ L.itemGap }};">
        <div style="display:{{ L.labelDisp }};font-family:'Inter',sans-serif;font-size:12px;letter-spacing:0.14em;color:#8a8d91;margin-bottom:8px;">STIMULUS</div>
        <sc-for list="{{ freqs }}" as="f" hint-placeholder-count="3">
          <button onClick="{{ f.select }}" style="flex:{{ f.flex }};display:flex;align-items:baseline;justify-content:{{ f.justify }};gap:6px;padding:{{ f.pad }};border-radius:10px;border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.fg }};cursor:pointer;text-align:left;">
            <span style="font-size:{{ f.size }};font-weight:500;letter-spacing:-0.02em;">{{ f.hz }}</span>
            <span style="font-family:'Inter',sans-serif;font-size:14px;">Hz</span>
          </button>
        </sc-for>
      </div>
    </div>
    <div style="display:{{ L.timeDisp }};flex-direction:column;gap:12px;">
      <div ref="{{ refTime }}" style="font-family:'Inter',sans-serif;font-size:14px;color:#8a8d91;text-align:center;font-variant-numeric:tabular-nums;">00:00.00</div>
    </div>
  </div>
  <div style="position:relative;min-height:0;min-width:0;">
  <div style="position:absolute;inset:0;display:{{ sigDisplay }};grid-template-rows:1fr 1fr;gap:1px;background:#24272b;">
    <div style="display:grid;grid-template-columns:{{ L.rowCols }};grid-template-rows:{{ L.rowRows }};gap:1px;min-height:0;">
      <div style="position:relative;background:#111315;min-height:0;">
        <canvas ref="{{ refH }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
        <div style="position:absolute;top:{{ L.hdrTop }};left:{{ L.hdrSide }};right:{{ L.hdrSide }};display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <div style="display:flex;align-items:center;gap:10px;pointer-events:none;min-width:0;">
            <div role="img" aria-label="speaker" style="flex:none;width:{{ L.iconSize }};height:{{ L.iconSize }};background:#85b6b2;-webkit-mask:url(uploads/speaker-filled-audio-tool.png) center/contain no-repeat;mask:url(uploads/speaker-filled-audio-tool.png) center/contain no-repeat;"></div>
            <span style="font-size:{{ L.titleSize }};font-weight:600;color:#85b6b2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">Underwater speaker signal</span>
          </div>
          <button onClick="{{ toggleH }}" style="flex:none;display:flex;align-items:center;gap:8px;height:{{ L.btnH }};padding:{{ L.btnPad }};border-radius:99px;border:1px solid #85b6b2;background:{{ hBg }};color:{{ hFg }};cursor:pointer;font-size:14px;font-weight:600;letter-spacing:0.08em;white-space:nowrap;"><span>{{ hIcon }}</span><span>{{ hLabel }}</span></button>
        </div>
      </div>
      <div style="position:relative;background:#111315;min-height:0;">
        <canvas ref="{{ refSH }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
        <div style="position:absolute;top:{{ L.specLabTop }};left:{{ L.hdrSide }};font-family:'Inter',sans-serif;font-size:12px;letter-spacing:0.14em;color:#8a8d91;pointer-events:none;">SPECTRUM</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:{{ L.rowCols }};grid-template-rows:{{ L.rowRows }};gap:1px;min-height:0;">
      <div style="position:relative;background:#111315;min-height:0;">
        <canvas ref="{{ refE }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
        <div style="position:absolute;top:{{ L.hdrTop }};left:{{ L.hdrSide }};right:{{ L.hdrSide }};display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <div style="display:flex;align-items:center;gap:10px;pointer-events:none;min-width:0;">
            <div role="img" aria-label="fish brain" style="flex:none;width:{{ L.iconSize }};height:{{ L.iconSize }};background:#e49444;-webkit-mask:url(uploads/fish.png) center/contain no-repeat;mask:url(uploads/fish.png) center/contain no-repeat;"></div>
            <span style="font-size:{{ L.titleSize }};font-weight:600;color:#e49444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">Fish neural signal</span>
          </div>
          <button onClick="{{ toggleE }}" style="flex:none;display:flex;align-items:center;gap:8px;height:{{ L.btnH }};padding:{{ L.btnPad }};border-radius:99px;border:1px solid #e49444;background:{{ eBg }};color:{{ eFg }};cursor:pointer;font-size:14px;font-weight:600;letter-spacing:0.08em;white-space:nowrap;"><span>{{ eIcon }}</span><span>{{ eLabel }}</span></button>
        </div>
      </div>
      <div style="position:relative;background:#111315;min-height:0;">
        <canvas ref="{{ refSE }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
      </div>
    </div>
  </div>
  <div style="position:absolute;inset:0;display:{{ aepDisplay }};flex-direction:column;align-items:center;justify-content:{{ L.aepJustify }};gap:{{ L.aepGap }};padding:{{ L.aepPad }};box-sizing:border-box;overflow-y:{{ L.aepOverflow }};">
    <h1 style="margin:0;max-width:1400px;width:100%;text-wrap:pretty;font-family:'Space Grotesk',sans-serif;font-size:{{ L.h1Size }};font-weight:600;line-height:1.2;color:#e8e6e1;">I measure the <span style="color:#e49444;">neural activity</span> of fish while they listen to <span style="color:#85b6b2;">sounds</span>.</h1>
    <div style="width:100%;max-width:1400px;aspect-ratio:2.12;min-height:0;flex:{{ L.cardFlex }};overflow:hidden;background:#ffffff;border-radius:14px;padding:{{ L.cardPad }};box-sizing:border-box;display:flex;">
      <div style="position:relative;flex:1;min-width:0;min-height:0;">
        <img src="uploads/aepdiagram_norays.png" alt="Auditory Evoked Potentials (AEP): present sound stimulus, record elicited response from electrodes, measure AEP" style="position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;">
        <svg viewBox="0 0 2560 1246" preserveAspectRatio="xMidYMid meet" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;">
          <g transform="translate(612 668)">
            <path d="M0.766 -0.643 A1 1 0 0 1 0.766 0.643" fill="none" stroke="#85b6b2" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke" style="transform-origin:0 0;animation:ehRipple 2.4s ease-out infinite;"></path>
            <path d="M0.766 -0.643 A1 1 0 0 1 0.766 0.643" fill="none" stroke="#85b6b2" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke" style="transform-origin:0 0;opacity:0;animation:ehRipple 2.4s ease-out -0.8s infinite;"></path>
            <path d="M0.766 -0.643 A1 1 0 0 1 0.766 0.643" fill="none" stroke="#85b6b2" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke" style="transform-origin:0 0;opacity:0;animation:ehRipple 2.4s ease-out -1.6s infinite;"></path>
          </g>
          <polyline points="1922,725 1935,700 1952,724 2000,699 2042,720 2057,683 2070,725 2100,582 2117,565 2157,709 2173,714 2187,724 2202,701 2237,734 2252,727 2280,739" pathLength="1" fill="none" stroke="#283b91" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:1;animation:ehDraw 3.2s ease-in-out infinite;"></polyline>
        </svg>
      </div>
    </div>
    <p style="margin:0;max-width:1400px;width:100%;font-family:'Space Grotesk',sans-serif;font-size:{{ L.pSize }};font-weight:600;line-height:1.2;color:#e8e6e1;text-wrap:pretty;">I have "sonified" these neural signals. Click on the signals tab to listen...</p>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;idleSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:60,&quot;min&quot;:10,&quot;max&quot;:600,&quot;step&quot;:10,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;traceMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;reveal&quot;,&quot;scroll&quot;],&quot;default&quot;:&quot;scroll&quot;,&quot;tsType&quot;:&quot;'reveal' | 'scroll'&quot;,&quot;section&quot;:&quot;Trace&quot;},&quot;windowMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1500,&quot;min&quot;:100,&quot;max&quot;:6000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Trace (scroll mode)&quot;},&quot;playheadPos&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.85,&quot;min&quot;:0.5,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Trace (scroll mode)&quot;},&quot;vZoom&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.3,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Trace&quot;},&quot;mutedOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.35,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Trace&quot;},&quot;showGrid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Trace&quot;},&quot;fMin&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:20,&quot;min&quot;:5,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;Hz&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Frequency axis&quot;},&quot;fMax&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2000,&quot;min&quot;:500,&quot;max&quot;:10000,&quot;step&quot;:100,&quot;unit&quot;:&quot;Hz&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Frequency axis&quot;}}">
const FFT_N = 8192, DB_FLOOR = -90, HARM = '#e7ca60';
const BG = '#111315';

function makeFFT(N) {
  const bits = Math.log2(N), rev = new Uint32Array(N);
  for (let i = 0; i < N; i++) { let r = 0, x = i; for (let b = 0; b < bits; b++) { r = (r << 1) | (x & 1); x >>= 1; } rev[i] = r; }
  const cos = new Float64Array(N / 2), sin = new Float64Array(N / 2), win = new Float64Array(N);
  for (let i = 0; i < N / 2; i++) { cos[i] = Math.cos(-2 * Math.PI * i / N); sin[i] = Math.sin(-2 * Math.PI * i / N); }
  for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
  const re = new Float64Array(N), im = new Float64Array(N), mag = new Float32Array(N / 2);
  // fill(i) returns the raw sample for window position i; returns magnitude array (shared)
  return function (fill) {
    for (let i = 0; i < N; i++) { re[rev[i]] = fill(i) * win[i]; im[rev[i]] = 0; }
    for (let size = 2; size <= N; size <<= 1) {
      const half = size >> 1, step = N / size;
      for (let s = 0; s < N; s += size) for (let j = 0; j < half; j++) {
        const k = j * step, a = s + j, b = a + half;
        const tr = re[b] * cos[k] - im[b] * sin[k], ti = re[b] * sin[k] + im[b] * cos[k];
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
      }
    }
    for (let i = 0; i < N / 2; i++) mag[i] = Math.sqrt(re[i] * re[i] + im[i] * im[i]);
    return mag;
  };
}
function hexRgb(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }

class Component extends DCLogic {
  state = { freq: 55, eOn: false, hOn: false, tab: 'aep', narrow: typeof window !== 'undefined' && window.innerWidth < 760 };
  constructor(p) {
    super(p);
    this.canvases = {}; this.buffers = {}; this.peaks = {}; this.smooth = {};
    this.offset = 0;
    this.fft = makeFFT(FFT_N);
    ['E', 'H', 'SE', 'SH'].forEach(k => { this['ref' + k] = el => { this.canvases[k] = el; }; });
    this.refTime = el => { this.timeEl = el; };
  }
  get fMin() { return this.props.fMin ?? 20; }
  get fMax() { return this.props.fMax ?? 2000; }
  componentDidMount() {
    this.ac = new (window.AudioContext || window.webkitAudioContext)();
    this.gE = this.ac.createGain(); this.gH = this.ac.createGain();
    this.gE.gain.value = 0; this.gH.gain.value = 0;
    this.gE.connect(this.ac.destination); this.gH.connect(this.ac.destination);
    [55, 100, 410].forEach(f => this.load(f));
    const loop = () => { this.raf = requestAnimationFrame(loop); this.frame(); };
    loop();
    this.onKey = e => {
      if (e.code === 'Space') { e.preventDefault(); this.toggleBoth(); }
      else if (e.key === 'e') this.toggle('e');
      else if (e.key === 'h') this.toggle('h');
      else if (e.key === 'a') this.setState(s => ({ tab: s.tab === 'aep' ? 'signals' : 'aep' }));
      else if (['1', '2', '3'].includes(e.key)) this.selectFreq([55, 100, 410][+e.key - 1]);
    };
    window.addEventListener('keydown', this.onKey);
    this.resetIdle = () => {
      clearTimeout(this.idleT);
      this.idleT = setTimeout(() => {
        if (this.running) this.setOn(false, false);
        this.offset = 0;
        this.setState({ tab: 'aep' });
      }, (this.props.idleSeconds ?? 60) * 1000);
    };
    ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(ev => window.addEventListener(ev, this.resetIdle, { passive: true }));
    this.resetIdle();
    this.onResize = () => { const n = window.innerWidth < 760; if (n !== this.state.narrow) this.setState({ narrow: n }); };
    window.addEventListener('resize', this.onResize); this.onResize();
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf); window.removeEventListener('keydown', this.onKey);
    clearTimeout(this.idleT); window.removeEventListener('resize', this.onResize); ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(ev => window.removeEventListener(ev, this.resetIdle));
    this.dead = true; this.stopSources(); this.ac && this.ac.close();
  }
  load(f) {
    return Promise.all(['electro', 'hydro'].map(type => {
      const key = type + '_' + f;
      if (this.buffers[key]) return this.buffers[key];
      return fetch('uploads/' + key + '.wav').then(r => r.arrayBuffer())
        .then(ab => new Promise((res, rej) => this.ac.decodeAudioData(ab, res, rej)))
        .then(buf => {
          const d = buf.getChannelData(0); let pk = 0;
          for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > pk) pk = a; }
          this.buffers[key] = buf; this.peaks[key] = pk || 1; return buf;
        }).catch(err => console.warn('load failed', key, err));
    }));
  }
  get running() { return this.state.eOn || this.state.hOn; }
  stopSources() { (this.sources || []).forEach(s => { try { s.stop(); } catch (e) {} }); this.sources = null; }
  start() {
    const f = this.state.freq;
    const bE = this.buffers['electro_' + f], bH = this.buffers['hydro_' + f];
    if (!bE || !bH) { this.load(f).then(() => this.running && !this.sources && this.start()); return; }
    this.stopSources(); this.ac.resume();
    const off = this.offset % Math.max(bE.duration, bH.duration);
    const when = this.ac.currentTime + 0.03;
    this.sources = [[bE, this.gE], [bH, this.gH]].map(([b, g]) => {
      const s = this.ac.createBufferSource(); s.buffer = b; s.loop = true;
      s.connect(g); s.start(when, off % b.duration); return s;
    });
    this.startAt = when - off;
  }
  curTime() { return this.sources ? Math.max(0, this.ac.currentTime - this.startAt) : this.offset; }
  applyGains() {
    const now = this.ac.currentTime;
    this.gE.gain.setTargetAtTime(this.state.eOn ? 1 : 0, now, 0.02);
    this.gH.gain.setTargetAtTime(this.state.hOn ? 1 : 0, now, 0.02);
  }
  unlockAudio() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
      if (this.ac.state !== 'running') this.ac.resume();
      if (!this._unlocked) {
        const b = this.ac.createBuffer(1, 1, 22050), s = this.ac.createBufferSource();
        s.buffer = b; s.connect(this.ac.destination); s.start(0); this._unlocked = true;
      }
    } catch (e) {}
  }
  setOn(eOn, hOn) {
    if (eOn || hOn) this.unlockAudio();
    const was = this.running;
    this.setState({ eOn, hOn }, () => {
      this.applyGains();
      if (!was && this.running) this.start();
      else if (was && !this.running) { this.offset = this.curTime(); this.stopSources(); }
    });
  }
  toggle(w) { const { eOn, hOn } = this.state; w === 'e' ? this.setOn(!eOn, false) : this.setOn(false, !hOn); }
  toggleBoth = () => { if (this.running) this.setOn(false, false); else this.setOn(false, true); };
  selectFreq(f) {
    if (f === this.state.freq) return;
    this.stopSources(); this.offset = 0; this.smooth = {};
    this.setState({ freq: f }, () => { if (this.running) this.start(); });
  }

  // ---------- drawing ----------
  prep(k) {
    const cv = this.canvases[k]; if (!cv) return null;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
    if (!W || !H) return null;
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    const c = cv.getContext('2d'); c.fillStyle = BG; c.fillRect(0, 0, W, H);
    return { c, W, H, dpr };
  }
  frame() {
    const t = this.curTime(), f = this.state.freq;
    const chans = [['E', 'electro_' + f, '#e49444', !this.state.eOn], ['H', 'hydro_' + f, '#85b6b2', !this.state.hOn]];
    if (this.state.tab !== 'aep') for (const [k, key, col, dim] of chans) {
      (this.props.traceMode ?? 'scroll') === 'scroll' ? this.drawWave(k, key, t, col, dim) : this.drawReveal(k, key, t, col, dim);
      this.drawSpectrum('S' + k, key, t, col, dim);
    }
    if (this.timeEl) {
      const str = String(Math.floor(t / 60)).padStart(2, '0') + ':' + (t % 60).toFixed(2).padStart(5, '0');
      if (str !== this._lastStr) { this._lastStr = str; this.timeEl.textContent = str; }
    }
  }
  geom(W, dpr) {
    const winS = (this.props.windowMs ?? 1500) / 1000;
    const head = W * (this.props.playheadPos ?? 0.85);
    return { winS, head, pxPerS: head / winS };
  }
  playhead(c, head, H, dpr, color, dim) {
    c.strokeStyle = dim ? '#3a3e44' : color; c.globalAlpha = dim ? 1 : 0.6; c.lineWidth = dpr;
    c.beginPath(); c.moveTo(Math.round(head) + 0.5, 0); c.lineTo(Math.round(head) + 0.5, H); c.stroke();
    c.globalAlpha = 1;
  }
  drawWave(k, key, t, color, dim) {
    const g = this.prep(k); if (!g) return;
    const { c, W, H, dpr } = g, { winS, head, pxPerS } = this.geom(W, dpr);
    const PT = (this.state.narrow ? 56 : 84) * dpr, PB = H - 40 * dpr, MID = (PT + PB) / 2;
    if (this.props.showGrid ?? true) {
      const step = 0.1 * pxPerS, phase = ((t / 0.1) % 1) * step;
      c.strokeStyle = '#1e2125'; c.lineWidth = 1; c.beginPath();
      for (let x = head - phase; x > -step; x -= step) { c.moveTo(Math.round(x) + 0.5, 0); c.lineTo(Math.round(x) + 0.5, H); }
      for (let x = head - phase + step; x < W; x += step) { c.moveTo(Math.round(x) + 0.5, 0); c.lineTo(Math.round(x) + 0.5, H); }
      for (let i = 0; i <= 4; i++) { const y = Math.round(PT + (PB - PT) * i / 4) + 0.5; c.moveTo(0, y); c.lineTo(W, y); }
